name: RemoteKoe
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
targets:
  RemoteKoe:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Sources, Shared, Resources]
    dependencies:
      - target: KaukoControl
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remote
    scheme:
      testTargets: [RemoteKoeUITests]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Controller
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Sovellus lähettää komentoja kotiverkon palvelimelle.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  KaukoControl:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Control, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remote.control
    info:
      path: Control/Info.plist
      properties:
        CFBundleDisplayName: Controller
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  RemoteKoeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [UITests]
    dependencies:
      - target: RemoteKoe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remote.uitests
        GENERATE_INFOPLIST_FILE: YES
